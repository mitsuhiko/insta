[toolchain]
# Toolchain for local development and the clippy/rustfmt CI jobs. Pinned a
# couple of releases behind the latest stable, so the lint set stays put and
# contributors don't need the newest Rust to reproduce CI. CI's other jobs
# override this (see tests.yml). Bumping it forward (keeping the lag) is welcome.
channel = "1.95.0"
components = ["clippy", "rustfmt"]
